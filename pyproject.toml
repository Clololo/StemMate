[project]
name = "stemmate"
version = "1.1.1"
description = "伴生 StemMate：本地解密 QQ 音乐加密音频并分离伴奏（全程离线）"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.4",
    "demucs-onnx[mp3]>=0.3.4",
    "onnxruntime>=1.17",
    "lameenc>=1.6",
    "av>=12.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
